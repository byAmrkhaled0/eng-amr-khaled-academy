<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة اختبار Techno Minds</title><style>body{font-family:Arial;margin:12px;background:#ddd}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}iframe{display:block;height:850px;border:1px solid #777;background:white;margin-inline:auto}button,select{padding:10px}</style><nav><b>معاينة محلية — لا تُرسل نماذج أثناء الاختبار</b><label>العرض <select id="width"><option>360</option><option>390</option><option>768</option><option>1200</option></select></label><button type="button" id="publicPage">الموقع والهيدر</button><button type="button" id="theme">تبديل الوضع</button><button type="button" id="payments">الخزنة</button><button type="button" id="report">التقرير</button></nav><iframe id="frame" title="معاينة المنصة" width="360" src="fixture.html"></iframe><script>const frame=document.getElementById('frame');document.getElementById('publicPage').onclick=()=>frame.src='../../index.html';document.getElementById('width').onchange=e=>frame.width=e.target.value;for(const name of ['theme','payments','report'])document.getElementById(name).onclick=()=>frame.contentWindow.postMessage({reviewAction:name},location.origin);</script></html>
